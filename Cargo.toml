[workspace]
resolver = "2"
members = [
    "crates/rpi-core",
    "crates/rpi-collect",
    "crates/rpi-inspections",
    "crates/rpi-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/flipslidersand/rust-project-inspector"
authors = ["dev-nodee"]

[workspace.dependencies]
rpi-core = { path = "crates/rpi-core" }
rpi-collect = { path = "crates/rpi-collect" }
rpi-inspections = { path = "crates/rpi-inspections" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syn = { version = "3", features = ["full", "visit"] }
cargo_metadata = "0.18"
petgraph = "0.6"
