name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      run-coverage: false

  audit:
    # RustSec advisory を検出したら fail（audit-check アクションは使わず公式 CLI を直接実行）。
    # runner 選択は共通ワークフロー（rust-test.yml）と同じ vars.GATE_RUNNER → ubuntu-latest。
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # ignore する advisory は .cargo/audit.toml の [advisories] ignore で管理する。
        run: cargo audit
