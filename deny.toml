# cargo-deny 設定。CI の `cargo deny check` が参照する。
# 対象: advisories(脆弱性・yanked)/ licenses / bans / sources

[graph]
all-features = true

[advisories]
# yanked crate は deny(CI が fail する)。
yanked = "deny"
# RustSec の ignore は .cargo/audit.toml 側で管理する(cargo audit と二重管理しない)。

[licenses]
# 許可ライセンスを明示する。ここに無いものは fail。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# workspace 内の path 依存(version 未指定)が公開 crate では wildcard 扱いになる。
# version の付与は crates.io publish 準備(#19)で行うので、それまでは warn。#19 で deny に戻す。
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
